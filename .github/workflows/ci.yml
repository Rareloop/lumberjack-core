name: CI

on: [push, pull_request]

jobs:
    ci:
        name: PHP ${{ matrix.php }} ${{ matrix.dependency_type }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ["8.3", "8.4", "8.5"]
                dependency_type: ["stable", "lowest"]
                include:
                    - dependency_type: "stable"
                      composer_flags: "--no-interaction --prefer-dist"
                    - dependency_type: "lowest"
                      composer_flags: "--no-interaction --prefer-dist --prefer-lowest"

        steps:
            - uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: xdebug, mbstring, openssl
                  tools: composer

            - name: Configure Git
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Install dependencies
              run: composer update ${{ matrix.composer_flags }}

            - name: Run lint
              run: composer run lint

            - name: Run tests
              run: ./vendor/bin/phpunit --coverage-clover ./tests/logs/clover.xml
              env:
                  XDEBUG_MODE: coverage
